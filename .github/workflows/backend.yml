name: Backend

# Pipeline 2 of 2. Runs only for changes the API depends on; a docs-only or frontend-only change does not start it.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'scripts/deploy/**'
      - '.github/workflows/backend.yml'
      - '!**/*.md'
  pull_request:
    paths:
      - 'backend/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'scripts/deploy/**'
      - '.github/workflows/backend.yml'
      - '!**/*.md'
permissions:
  contents: read

defaults:
  run:
    shell: bash

# Verification runs on GitHub-hosted runners for pushes and pull requests. Deployment runs only on main, and only when the
# repository variable AWS_DEPLOY_ENABLED is 'true' (after the stacks and the GitHub OIDC provider exist in your AWS account).
jobs:
  verify:
    name: Typecheck, test and build Lambdas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @servicecare/api
      - run: npm run test:backend
      - run: npm run test:scripts
      - name: Build every backend bundle
        run: |
          npm run build:lambda -w @servicecare/api
          npm run build:ticket-events -w @servicecare/api
          # Compile checks only: Terraform (infra/analytics) deploys the analytics consumer, the visual images are built
          # from backend/visual.Dockerfile and the inactive ticket gateway is published by hand (docs/deployment.md).
          npm run build:analytics -w @servicecare/api
          npm run build:ticket-tools -w @servicecare/api

  deploy:
    name: Publish code to Lambda
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
    concurrency:
      group: backend-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Short-lived credentials from GitHub's OIDC token; the role trusts only this repository's main branch.
      - name: Assume the deploy role
        run: node scripts/deploy.mjs ci-login backend

      # Same code as npm run deploy:backend: builds and publishes the API, ticket-events and ticket-actions Lambdas,
      # waits for each update, then checks /api/health (200) and /api/tickets without a token (401).
      - name: Publish the backend Lambdas
        run: node scripts/deploy.mjs backend
